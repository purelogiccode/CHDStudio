# Builds the release zips and attaches them to a GitHub release.
#
# Cut a release by pushing a tag that matches the version in
# CHDStudio/CHDStudio.csproj, e.g.:
#   git tag release_3.9.0 && git push origin release_3.9.0
#
# Artifacts: one release_<version>_<rid>.zip per runtime identifier, for
# Windows (win-x64, win-arm64), Linux (linux-x64, linux-arm64) and macOS
# (osx-x64, osx-arm64). The app is framework-dependent (users install the
# .NET 10 Desktop Runtime on Windows, the .NET 10 runtime on Linux/macOS)
# and published as a single file; see scripts/ci/package-release.ps1.
name: Release

on:
  push:
    tags: ["release_*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. release_3.9.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    name: Resolve version & release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Resolve and validate version
        id: version
        run: node scripts/ci/version.mjs --tag "$TAG" --github-output

      - name: Extract release notes from WhatsNew.md
        run: node scripts/ci/release-notes.mjs --version "${{ steps.version.outputs.version }}" --out release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    name: Test
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharp_CHDStudio.sln

      - name: Build
        run: dotnet build CSharp_CHDStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test CHDStudio.Tests/CHDStudio.Tests.csproj -c Release --no-build --filter "Category!=Integration"

  package:
    name: Package ${{ matrix.rid }}
    needs: [meta, test]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            tfm: net10.0-windows
          - rid: win-arm64
            tfm: net10.0-windows
          - rid: linux-x64
            tfm: net10.0
          - rid: linux-arm64
            tfm: net10.0
          - rid: osx-x64
            tfm: net10.0
          - rid: osx-arm64
            tfm: net10.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file (framework-dependent)
        run: >
          dotnet publish CHDStudio/CHDStudio.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Build release zip
        shell: pwsh
        run: >
          ./scripts/ci/package-release.ps1
          -Rid '${{ matrix.rid }}'
          -Version '${{ needs.meta.outputs.version }}'
          -PublishDir 'publish/${{ matrix.rid }}'
          -OutputDir 'dist'

      - name: Verify non-Windows zip execute bits
        if: startsWith(matrix.rid, 'linux-') || startsWith(matrix.rid, 'osx-')
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = "dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.zip"
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
              foreach ($name in @('CHDStudio', '7zz')) {
                  $entry = $zip.GetEntry($name)
                  if (-not $entry) { throw "Release zip is missing $name" }
                  $mode = ($entry.ExternalAttributes -shr 16) -band 0xFFFF
                  if ($mode -ne 0x81ED) {
                      throw "$name has Unix mode 0$([Convert]::ToString($mode, 8)), expected 0100755"
                  }
              }
          }
          finally {
              $zip.Dispose()
          }

      - name: Attest release zip provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.zip

      - name: Upload release zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.rid }}
          path: dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.zip
          if-no-files-found: error

  publish:
    name: Create GitHub release
    needs: [meta, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The job has no checkout (only downloaded artifacts); without this
          # gh falls back to git-remote discovery and fails with
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -l release
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - updating notes and uploading assets with --clobber."
            gh release edit "$TAG" \
              --title "$VERSION" \
              --notes-file release/release-notes.md \
              "${prerelease[@]}"
            gh release upload "$TAG" release/*.zip --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$VERSION" \
              --notes-file release/release-notes.md \
              "${prerelease[@]}" \
              release/*.zip
          fi

      - name: Verify all six release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            name="release_${VERSION}_${rid}.zip"
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$name"; then
              echo "::error::Release $TAG is missing $name"
              exit 1
            fi
          done
          echo "All six release zips are attached to $TAG."
