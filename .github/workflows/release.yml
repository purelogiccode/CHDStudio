# Builds the platform release bundles and attaches them to a GitHub release.
#
# Cut a release by pushing a tag that matches the version in
# CHDStudio/CHDStudio.csproj, e.g.:
#   git tag release_3.15.0 && git push origin release_3.15.0
#
# Artifacts:
#   * release_<version>_win-<arch>.zip   (Windows)
#   * release_<version>_linux-<arch>.tar.gz (Linux, with a CHDStudio/ folder)
#   * release_<version>_linux-<arch>.AppImage
#   * release_<version>_linux-<arch>.flatpak
#   * release_<version>_osx-<arch>.dmg   (macOS, with a CHDStudio/ folder)
# for win-x64, win-arm64, linux-x64, linux-arm64, osx-x64 and osx-arm64.
# The primary bundles are framework-dependent (users install the .NET 11
# Desktop Runtime on Windows, the .NET 11 runtime on Linux/macOS) and published
# as a single file; the AppImage and Flatpak are self-contained.
name: Release

on:
  push:
    tags: ["release_*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. release_3.15.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    name: Resolve version & release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Resolve and validate version
        id: version
        run: node scripts/ci/version.mjs --tag "$TAG" --github-output

      - name: Extract release notes from WhatsNew.md
        run: node scripts/ci/release-notes.mjs --version "${{ steps.version.outputs.version }}" --out release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    name: Test
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore CSharp_CHDStudio.sln

      - name: Build
        run: dotnet build CSharp_CHDStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test CHDStudio.Tests/CHDStudio.Tests.csproj -c Release --no-build --filter "Category!=Integration"

  package:
    name: Package ${{ matrix.rid }}
    needs: [meta, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            tfm: net11.0-windows
            os: windows-latest
            ext: .zip
          - rid: win-arm64
            tfm: net11.0-windows
            os: windows-latest
            ext: .zip
          - rid: linux-x64
            tfm: net11.0
            os: ubuntu-24.04
            ext: .tar.gz
          - rid: linux-arm64
            tfm: net11.0
            os: ubuntu-24.04-arm
            ext: .tar.gz
          - rid: osx-x64
            tfm: net11.0
            os: macos-latest
            ext: .dmg
          - rid: osx-arm64
            tfm: net11.0
            os: macos-latest
            ext: .dmg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Publish single-file (framework-dependent)
        run: >
          dotnet publish CHDStudio/CHDStudio.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Build release bundle
        shell: pwsh
        run: >
          ./scripts/ci/package-release.ps1
          -Rid '${{ matrix.rid }}'
          -Version '${{ needs.meta.outputs.version }}'
          -PublishDir 'publish/${{ matrix.rid }}'
          -OutputDir 'dist'

      - name: Verify Windows bundle
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.zip" -DestinationPath verify
          $required = @('CHDStudio.exe', 'LICENSE.txt', 'ReadMe.md', 'WhatsNew.md', 'chdman.exe', '7za.exe')
          if ('${{ matrix.rid }}' -eq 'win-arm64') {
              $required = @('CHDStudio.exe', 'LICENSE.txt', 'ReadMe.md', 'WhatsNew.md', 'chdman_arm64.exe', '7za_arm64.exe')
          }
          foreach ($name in $required) {
              if (-not (Test-Path -LiteralPath "verify/$name")) { throw "Release bundle is missing $name" }
          }

      - name: Verify Linux bundle
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.tar.gz"
          mkdir -p verify
          tar -xzf "$asset" -C verify
          for name in CHDStudio 7zz; do
            test -x "verify/CHDStudio/$name"
          done
          for name in LICENSE.txt ReadMe.md WhatsNew.md 7-Zip-License.txt libHarfBuzzSharp.so libSkiaSharp.so; do
            test -f "verify/CHDStudio/$name"
          done

      - name: Verify macOS bundle
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.dmg"
          mount_point="$(mktemp -d)"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          hdiutil attach "$asset" -nobrowse -readonly -mountpoint "$mount_point" -quiet
          for name in CHDStudio 7zz; do
            test -x "$mount_point/CHDStudio/$name"
          done
          for name in LICENSE.txt ReadMe.md WhatsNew.md 7-Zip-License.txt libAvaloniaNative.dylib libHarfBuzzSharp.dylib libSkiaSharp.dylib; do
            test -f "$mount_point/CHDStudio/$name"
          done

      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}${{ matrix.ext }}

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.rid }}
          path: dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}${{ matrix.ext }}
          if-no-files-found: error

  package-linux-extras:
    name: Package ${{ matrix.rid }} AppImage & Flatpak
    needs: [meta, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: x86_64
            os: ubuntu-24.04
          - rid: linux-arm64
            arch: aarch64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Install Flatpak and runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb dbus-x11
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08

      - name: Publish self-contained single-file app
        run: >
          dotnet publish CHDStudio/CHDStudio.csproj
          -c Release
          -f net11.0
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o publish-extras/${{ matrix.rid }}

      - name: Build AppImage and Flatpak
        run: >
          bash scripts/ci/package-linux-extra.sh
          --rid '${{ matrix.rid }}'
          --arch '${{ matrix.arch }}'
          --version '${{ needs.meta.outputs.version }}'
          --publish-dir 'publish-extras/${{ matrix.rid }}'
          --output-dir 'dist'

      - name: Smoke-test AppImage and Flatpak
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          rid="${{ matrix.rid }}"
          appimage="dist/release_${version}_${rid}.AppImage"
          flatpak="dist/release_${version}_${rid}.flatpak"

          chmod +x "$appimage"
          set +e
          timeout 25s xvfb-run -a -s "-screen 0 1440x900x24" \
            env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" > appimage.log 2>&1
          app_code=$?
          set -e
          if [[ $app_code -ne 0 && $app_code -ne 124 ]]; then
            cat appimage.log
            exit 1
          fi

          flatpak install --user --noninteractive --assumeyes "$flatpak"
          set +e
          timeout 25s dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" \
            flatpak run com.purelogiccode.CHDStudio > flatpak.log 2>&1
          flat_code=$?
          set -e
          if [[ $flat_code -ne 0 && $flat_code -ne 124 ]]; then
            cat flatpak.log
            exit 1
          fi

      - name: Attest Linux extras
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.AppImage
            dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.flatpak

      - name: Upload Linux extras
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.rid }}-extras
          path: |
            dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.AppImage
            dist/release_${{ needs.meta.outputs.version }}_${{ matrix.rid }}.flatpak
          if-no-files-found: error

  publish:
    name: Create GitHub release
    needs: [meta, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The job has no checkout (only downloaded artifacts); without this
          # gh falls back to git-remote discovery and fails with
          # "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -l release
          shopt -s nullglob
          assets=(release/*.zip release/*.tar.gz release/*.dmg release/*.AppImage release/*.flatpak)
          if [[ ${#assets[@]} -ne 10 ]]; then
            echo "::error::Expected ten release bundles, found ${#assets[@]}."
            exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - updating notes and uploading assets with --clobber."
            gh release edit "$TAG" \
              --title "$VERSION" \
              --notes-file release/release-notes.md \
              "${prerelease[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$VERSION" \
              --notes-file release/release-notes.md \
              "${prerelease[@]}" \
              "${assets[@]}"
          fi

      - name: Verify all ten release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "release_${VERSION}_win-x64.zip"
            "release_${VERSION}_win-arm64.zip"
            "release_${VERSION}_linux-x64.tar.gz"
            "release_${VERSION}_linux-arm64.tar.gz"
            "release_${VERSION}_linux-x64.AppImage"
            "release_${VERSION}_linux-arm64.AppImage"
            "release_${VERSION}_linux-x64.flatpak"
            "release_${VERSION}_linux-arm64.flatpak"
            "release_${VERSION}_osx-x64.dmg"
            "release_${VERSION}_osx-arm64.dmg"
          )
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for name in "${expected[@]}"; do
            if ! grep -qx "$name" <<< "$assets"; then
              echo "::error::Release $TAG is missing $name"
              exit 1
            fi
          done
          echo "All ten release bundles are attached to $TAG."
