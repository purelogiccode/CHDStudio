# Build and test every push to master and every pull request.
# Release artifacts are produced by release.yml; docs by docs.yml.
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore CSharp_CHDStudio.sln

      - name: Build
        run: dotnet build CSharp_CHDStudio.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test CHDStudio.Tests/CHDStudio.Tests.csproj
          -c Release --no-build
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Verify version script
        run: node scripts/ci/version.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  cross-platform-build:
    name: Build neutral TFM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CHDStudio/CHDStudio.csproj

      - name: Build neutral TFM
        run: dotnet build CHDStudio/CHDStudio.csproj -c Release -f net10.0 --no-restore
